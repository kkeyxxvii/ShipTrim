# Publishes ShipTrim to GitHub Pages on every push to main.
#
# ONE-TIME MANUAL STEP: in Settings -> Pages -> Build and deployment, set
# Source to "GitHub Actions". A workflow cannot do this for you: creating a
# Pages site needs administration:write, which the built-in GITHUB_TOKEN
# never has, whatever permissions the workflow requests. Once the site
# exists, this workflow deploys to it with no extra token.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # Assemble explicitly rather than uploading the repository root, so
      # .git and the workflow itself never reach the published site.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R index.html app.js styles.css vendor samples LICENSE _site/
          touch _site/.nojekyll
          du -sh _site && ls -a _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # .nojekyll is a dotfile and this action drops hidden files by default.
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
